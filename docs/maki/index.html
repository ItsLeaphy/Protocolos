<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1B1226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maki">
<link rel="manifest" id="manifestLink">
<style>

:root {
  --paper: #F4ECDD;
  --paper-2: #EADFCB;
  --ink: #221820;
  --ink-soft: #5B4D52;
  --ink-faint: #8A7A7C;
  --hair: rgba(34,24,32,0.16);
  --accent: #B8432A;
  --accent-ink: #FFF6E8;
  --night: #1B1226;
  --cream: #FFF6E8;
  --day-seg: #D9542F; --day-ter: #8A9A3B; --day-qua: #E5A72B;
  --day-qui: #2E4B8F; --day-sex: #8C2F4A; --day-sab: #3F8E86; --day-dom: #6B5B8C;
}
[data-theme="dark"] {
  --paper: #171018;
  --paper-2: #21171F;
  --ink: #F4E9D8;
  --ink-soft: rgba(244,233,216,0.74);
  --ink-faint: rgba(244,233,216,0.5);
  --hair: rgba(244,233,216,0.16);
  --accent: #F0B23E;
  --accent-ink: #171018;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .4s ease, color .3s ease; }
::selection { background: var(--accent); color: var(--accent-ink); }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 1.3rem 6rem; }

/* ---------- COVER: a pintura é a capa ---------- */
.cover {
  position: relative;
  margin: 0 -1.3rem;
  min-height: 92vh;
  background: var(--night) var(--cover-img) center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 1.4rem 1.6rem 2.4rem;
  color: #FFF6E8;
  overflow: hidden;
}
.cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,10,26,.55) 0%, rgba(20,10,26,.05) 34%, rgba(20,10,26,.05) 55%, rgba(20,10,26,.78) 100%); pointer-events: none; }
.cover > * { position: relative; z-index: 2; }
.top-bar { display: flex; justify-content: space-between; align-items: baseline; }
.mark { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.7rem; }
.theme-toggle { border: none; background: rgba(20,10,26,.35); color: #FFF6E8; font-family: 'Inter', sans-serif; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.theme-toggle .d { display: none; }
[data-theme="dark"] .theme-toggle .l { display: none; }
[data-theme="dark"] .theme-toggle .d { display: inline; }
.cover-kicker { font-size: 13px; opacity: .85; margin-bottom: .8rem; }
.cover-title { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(4.6rem, 21vw, 12rem); line-height: .8; letter-spacing: -.02em; margin: 0; text-shadow: 0 3px 40px rgba(10,4,14,.55); }
.cover-title em { font-style: italic; color: #F5C24C; }
.cover-sub { max-width: 34ch; margin: 1.6rem 0 0; font-size: 17px; line-height: 1.55; text-shadow: 0 1px 14px rgba(10,4,14,.7); }

/* ---------- WEEK: régua em papel ---------- */
.week-strip-wrap { margin: 0 -1.3rem; padding: 1.6rem 1.3rem .4rem; overflow-x: auto; scrollbar-width: none; }
.week-strip-wrap::-webkit-scrollbar { display: none; }
.week-strip { display: flex; gap: 10px; min-width: max-content; }
.week-chip { flex: 0 0 auto; width: 118px; padding: 1rem 1rem 1.05rem; border: 2px solid var(--wc-c, var(--hair)); border-radius: 999px 999px 16px 16px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform .2s ease, background .2s ease; }
.week-chip:hover { transform: translateY(-3px); }
.week-chip.on { background: var(--wc-c, var(--ink)); }
.week-chip.on .wc-num, .week-chip.on .wc-day, .week-chip.on .wc-title { color: #FFF6E8; }
.wc-num { font-family: 'Instrument Serif', serif; font-size: 2.5rem; line-height: 1; padding-top: 1rem; color: var(--wc-c, var(--ink)); }
.wc-day { font-size: 12px; color: var(--ink-soft); margin-top: .35rem; }
.wc-title { font-size: 13px; font-weight: 600; line-height: 1.25; margin-top: .15rem; }
.week-chip.is-today .wc-day::after { content: ' · hoje'; }

/* ---------- DAY: cabeçalho pintado + corpo calmo ---------- */
#panels { margin-top: 2rem; }
.day-panel { display: none; }
.day-panel.active { display: block; animation: rise .55s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.day-hero {
  position: relative; margin: 0 -1.3rem 2rem; min-height: 46vh; overflow: hidden;
  background: var(--night) center/cover no-repeat; color: #FFF6E8; display: flex; align-items: flex-end;
}
.day-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,10,26,.15) 0%, rgba(20,10,26,.0) 40%, rgba(20,10,26,.8) 100%); }
.day-hero-in { position: relative; z-index: 2; padding: 1.6rem 1.6rem 1.8rem; width: 100%; }
.day-seal { font-family: 'Instrument Serif', serif; font-size: clamp(6.5rem, 28vw, 14rem); line-height: .76; color: #FFF6E8; -webkit-text-stroke: 2px rgba(20,10,26,.85); paint-order: stroke fill; text-shadow: 0 4px 34px rgba(10,4,14,.7); }
.day-kicker { font-size: 13px; opacity: .9; margin: .8rem 0 .2rem; }
.day-heading h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: .95; margin: 0; text-shadow: 0 2px 24px rgba(10,4,14,.6); }
.day-sub { font-size: 15px; margin: .5rem 0 0; opacity: .92; }

.day-body { display: grid; grid-template-columns: 1fr; gap: 2rem; }
@media (min-width: 780px) { .day-body { grid-template-columns: 1fr 1.6fr; gap: 3rem; align-items: start; } }
.day-notes p.intro { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.35rem; line-height: 1.4; margin: 0 0 1.4rem; }
.note-block { margin-bottom: 1.1rem; }
.nb-label { font-size: 12px; font-weight: 600; color: var(--seal-c, var(--accent)); margin-bottom: .2rem; }
.nb-val { font-size: 14.5px; color: var(--ink-soft); }
.skill-note { border-top: 1px solid var(--hair); padding-top: 1.1rem; margin-top: 1.3rem; }
.sn-name { font-family: 'Instrument Serif', serif; font-size: 1.7rem; line-height: 1.1; }
.sn-desc { font-size: 13px; color: var(--ink-faint); }

.ex-list { border-top: 2px solid var(--seal-c, var(--ink)); }
.ex-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--hair); }
.reorder-arrows { display: none; flex-direction: column; border-right: 1px solid var(--hair); }
.day-panel.reorder-active .reorder-arrows { display: flex; }
.arrow-btn { flex: 1 1 50%; border: none; background: transparent; color: var(--ink); font-size: 13px; width: 30px; cursor: pointer; padding: 0; }
.arrow-btn:disabled { opacity: .25; cursor: default; }
.arrow-btn:not(:disabled):hover { background: var(--paper-2); }
.ex-main { flex: 1 1 auto; min-width: 0; }
.ex-head { display: flex; align-items: center; gap: .9rem; padding: 1.05rem .2rem; cursor: pointer; }
.ex-n { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: var(--seal-c, var(--accent)); width: 32px; flex: 0 0 auto; }
.ex-name { flex: 1 1 auto; font-size: 16px; font-weight: 500; }
.ex-meta { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
.ex-plus { font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--ink-faint); width: 16px; text-align: center; flex: 0 0 auto; }
.done-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--seal-c, var(--accent)); margin-left: 8px; }
.ex-body { display: grid; grid-template-rows: 0fr; overflow: hidden; transition: grid-template-rows .25s ease; }
.ex-body > .ex-body-inner { overflow: hidden; min-height: 0; }
.ex-row.open .ex-body { grid-template-rows: 1fr; }
.ex-body-inner { padding: 0 .2rem 0 46px; max-height: 0; transition: padding .25s ease; font-size: 14.5px; color: var(--ink-soft); line-height: 1.6; }
.ex-row.open .ex-body-inner { padding: 0 .2rem 1.3rem 46px; max-height: none; }
.ex-body-inner b { color: var(--ink); font-weight: 600; }
.done-check { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 13px; color: var(--ink); cursor: pointer; user-select: none; }
.done-check input { position: absolute; opacity: 0; width: 0; height: 0; }
.done-check .box { width: 17px; height: 17px; border: 1.5px solid var(--ink-faint); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.done-check .box::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--seal-c, var(--accent)); opacity: 0; transform: scale(.3); transition: opacity .15s ease, transform .15s ease; }
.done-check input:checked ~ .box { border-color: var(--seal-c, var(--accent)); }
.done-check input:checked ~ .box::after { opacity: 1; transform: scale(1); }
.weight-track { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); }
.weight-last { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 9px; }
.weight-last b { color: var(--ink); }
.weight-form { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.weight-input, .weight-type { border: 1.5px solid var(--hair); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; padding: 8px 14px; }
.weight-input { width: 78px; }
.weight-input:focus, .weight-type:focus { outline: none; border-color: var(--accent); }
.weight-saved-tag { font-size: 12px; font-weight: 600; color: var(--accent); margin-left: 4px; }
.cooldown-note { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.1rem; color: var(--ink-soft); margin: 1.4rem 0 0; }
.btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 10px 20px; transition: transform .15s ease, background .15s ease, color .15s ease; }
.btn:active { transform: scale(.97); }
.btn-primary { border: none; background: var(--accent); color: var(--accent-ink); }
.btn-secondary { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
.btn-secondary:hover, .btn-secondary.active { background: var(--ink); color: var(--paper); }
.btn-ghost { border: none; background: none; color: var(--ink-faint); padding: 6px 8px; font-weight: 500; }
.btn-ghost:hover { color: var(--ink); }
.action-row { display: flex; justify-content: center; margin-top: 1.6rem; }
.ghost-row { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }

/* ---------- SEÇÕES: título pintado curto + corpo calmo ---------- */
.section-head { margin: 5rem 0 1.4rem; }
.section-head h2 { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: clamp(2.8rem, 10vw, 4.8rem); line-height: 1; margin: 0; display: inline-block; padding: .05em .28em .12em; color: #FFF6E8; background: var(--night) var(--cover-img) center/cover; border-radius: 6px 26px 6px 26px; text-shadow: 0 2px 16px rgba(10,4,14,.6); }
.panel-soft { background: var(--paper-2); border-radius: 22px; padding: 1.4rem; }
.progress-select { width: 100%; border: 1.5px solid var(--hair); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 16px; margin-bottom: 1.1rem; }
.progress-empty { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.2rem; color: var(--ink-soft); margin: 0; }
.progress-svg { width: 100%; height: auto; display: block; }
.progress-current { margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
.progress-current b { color: var(--ink); }
.appendix-list { display: grid; gap: 10px; }
.appendix-item { background: var(--paper-2); border-radius: 20px; padding: 1.2rem 1.4rem; cursor: pointer; }
.ai-head { display: flex; align-items: baseline; gap: .9rem; }
.ai-num { font-family: 'Instrument Serif', serif; font-size: 1.3rem; color: var(--accent); }
.appendix-item h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.5rem; margin: 0; flex: 1; line-height: 1.15; }
.ai-hint { font-size: 12px; color: var(--ink-faint); }
.ai-body { display: grid; grid-template-rows: 0fr; overflow: hidden; transition: grid-template-rows .3s ease; }
.ai-body > div { overflow: hidden; min-height: 0; }
.appendix-item.open .ai-body { grid-template-rows: 1fr; margin-top: .9rem; }
.ai-body-inner { padding-left: 2.2rem; font-size: 15px; line-height: 1.75; color: var(--ink-soft); }
.ai-body-inner b { color: var(--ink); font-weight: 600; }
.colophon { margin-top: 5rem; text-align: center; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.15rem; color: var(--ink-soft); }
@media (max-width: 779px) { .week-chip { width: 106px; } .cover { min-height: 86vh; } }

</style>
</head>
<body data-theme="light">

<div class="wrap">
  <section class="cover">
    <div class="top-bar">
      <span class="mark">maki</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema"><span class="l">noite</span><span class="d">luz</span></button>
    </div>
    <div>
      <div class="cover-kicker">para Helena</div>
      <h1 class="cover-title">Um corpo<br>que se <em>escuta.</em></h1>
      <p class="cover-sub">Pernas primeiro, depois costas, cintura e braço. Seis dias, cada um com sua cor, e nenhum músculo esquecido.</p>
    </div>
  </section>

  <div class="week-strip-wrap"><nav class="week-strip" id="weekStrip"></nav></div>

  <div id="panels"></div>

  <section>
    <div class="section-head"><h2>progressão</h2></div>
    <div class="panel-soft" id="progressaoContent"></div>
  </section>

  <section>
    <div class="section-head"><h2>notas</h2></div>
    <div class="appendix-list" id="accordion"></div>
  </section>

  <div class="colophon">feito pra ela, dia a dia.</div>
</div>

function buildWeekStrip() {
  const nav = document.getElementById('weekStrip');
  nav.innerHTML = '';
  days.forEach(d => {
    const btn = document.createElement('button');
    const c = DAY_ACCENT[d.id];
    btn.className = 'week-chip' + (d.rest ? ' rest' : '') + (d.id === todayId ? ' is-today' : '');
    btn.dataset.id = d.id;
    if (c) btn.style.setProperty('--wc-c', c.bg);
    btn.innerHTML = `
      <div class="wc-num">${d.num}</div>
      <div class="wc-day">${d.label}</div>
      <div class="wc-title">${d.title}</div>`;
    btn.addEventListener('click', () => selectDay(d.id));
    nav.appendChild(btn);
  });
}

function selectDay(id) {
  document.querySelectorAll('.day-panel').forEach(p => p.classList.toggle('active', p.dataset.id === id));
  document.querySelectorAll('.week-chip').forEach(c => c.classList.toggle('on', c.dataset.id === id));
  buildAccordion(id);
  setHeroPainting(id);
  document.body.dataset.day = id;
}

// --- Reordenação manual por dia ---
function getOrder(dayId, count) {
  const def = Array.from({ length: count }, (_, i) => i);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('ordem-' + dayId)); } catch (e) {}
  if (!Array.isArray(saved) || saved.length !== count) return def;
  const valid = saved.every(n => Number.isInteger(n) && n >= 0 && n < count) &&
                new Set(saved).size === count;
  return valid ? saved : def;
}

function hasCustomOrder(dayId) {
  try { return !!localStorage.getItem('ordem-' + dayId); } catch (e) { return false; }
}

function saveOrder(dayId, order) {
  try { localStorage.setItem('ordem-' + dayId, JSON.stringify(order)); } catch (e) {}
}

function clearOrder(dayId) {
  try { localStorage.removeItem('ordem-' + dayId); } catch (e) {}
}

// --- Completude semanal (reseta sozinho ao virar a semana ISO) ---
function getWeekKey(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-S' + weekNo;
}

function getCompletion(dayId) {
  const key = 'progresso-' + getWeekKey(new Date());
  let all = {};
  try { all = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  return all[dayId] || {};
}

function toggleCompletion(dayId, exIdx) {
  const key = 'progresso-' + getWeekKey(new Date());
  let all = {};
  try { all = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  if (!all[dayId]) all[dayId] = {};
  all[dayId][exIdx] = !all[dayId][exIdx];
  try { localStorage.setItem(key, JSON.stringify(all)); } catch (e) {}
  return all[dayId][exIdx];
}

// --- Histórico de peso (append-only por exercício) ---
function historyKey(dayId, exIdx) {
  return 'historico-' + dayId + '-' + exIdx;
}

function getHistory(dayId, exIdx) {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(historyKey(dayId, exIdx))) || []; } catch (e) {}
  return Array.isArray(arr) ? arr : [];
}

function getLastEntry(dayId, exIdx) {
  const hist = getHistory(dayId, exIdx);
  return hist.length ? hist[hist.length - 1] : null;
}

function addHistoryEntry(dayId, exIdx, valor, tipo) {
  const hist = getHistory(dayId, exIdx);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (hist.length && hist[hist.length - 1].data === todayStr) {
    hist[hist.length - 1] = { data: todayStr, valor, tipo };
  } else {
    hist.push({ data: todayStr, valor, tipo });
  }
  try { localStorage.setItem(historyKey(dayId, exIdx), JSON.stringify(hist)); } catch (e) {}
}

function formatWeight(entry) {
  if (!entry) return null;
  return entry.tipo === 'lado' ? entry.valor + ' kg por lado' : entry.valor + ' kg';
}

function buildPanels(activeId) {
  const container = document.getElementById('panels');
  const currentActive = activeId || document.querySelector('.day-panel.active')?.dataset.id || (days[0] && days[0].id);
  container.innerHTML = '';
  days.forEach(d => {
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (d.id === currentActive ? ' active' : '');
    panel.dataset.id = d.id;

    if (d.rest) {
      panel.innerHTML = `
        <div class="day-hero" data-paint="${d.id}" style="--seal-c: var(--day-dom);">
          <div class="day-hero-in">
            <div class="day-seal">${d.num}</div>
            <div class="day-heading">
              <div class="day-kicker">${d.label}</div>
              <h2>${d.title}</h2>
            </div>
          </div>
        </div>
        <p class="day-notes"><em>${d.intro}</em></p>`;
      container.appendChild(panel);
      return;
    }

    const c = DAY_ACCENT[d.id];
    let html = `<div class="day-hero" data-paint="${d.id}" style="--seal-c: ${c.bg};">
      <div class="day-hero-in">
        <div class="day-seal">${d.num}</div>
        <div class="day-heading">
          <div class="day-kicker">${d.label}${d.id === todayId ? ' · hoje' : ''}</div>
          <h2>${d.title}</h2>
          <div class="day-sub">${d.subtitle}</div>
        </div>
      </div>
    </div>
    <div class="day-body" style="--seal-c: ${c.bg};">
      <div class="day-notes">
        <p class="intro">${d.intro}</p>
        <div class="note-block">
          <div class="nb-label">Aquecimento</div>
          <div class="nb-val">${d.warmup}</div>
        </div>`;

    if (d.skill) {
      html += `<div class="skill-note">
          <div class="nb-label">Skill do dia</div>
          <div class="sn-name">${d.skill.name}</div>
          <div class="sn-desc">${d.skill.desc}</div>
        </div>`;
    }

    html += `</div><div class="day-exercises">
      <div class="ex-list">`;

    const order = getOrder(d.id, d.exercises.length);
    const completion = getCompletion(d.id);
    order.forEach((realIdx, pos) => {
      const ex = d.exercises[realIdx];
      const done = !!completion[realIdx];
      html += `<div class="ex-row" data-idx="${realIdx}">
        <div class="reorder-arrows">
          <button type="button" class="arrow-btn" data-dir="up" ${pos === 0 ? 'disabled' : ''} aria-label="Mover para cima">↑</button>
          <button type="button" class="arrow-btn" data-dir="down" ${pos === order.length - 1 ? 'disabled' : ''} aria-label="Mover para baixo">↓</button>
        </div>
        <div class="ex-main">
        <div class="ex-head">
          <div class="ex-n">${String(pos + 1).padStart(2, '0')}</div>
          <div class="ex-name">${ex.name}${done ? '<span class="done-dot" aria-label="Feito esta semana"></span>' : ''}</div>
          <div class="ex-meta">${[ex.sets, ex.rir].filter(Boolean).join(' / ')}</div>
          <div class="ex-plus">+</div>
        </div>
        <div class="ex-body"><div class="ex-body-inner">
          <b>${ex.role}</b>${ex.detail ? ' — ' + ex.detail : ''}
          <label class="done-check">
            <input type="checkbox" class="done-checkbox" data-day="${d.id}" data-idx="${realIdx}" ${done ? 'checked' : ''}>
            <span class="box"></span>
            <span>feito essa semana</span>
          </label>
          <div class="weight-track" data-day="${d.id}" data-idx="${realIdx}"></div>
        </div></div>
        </div>
      </div>`;
    });

    html += `</div>`;

    html += `<div class="action-row">
      <button type="button" class="quick-register btn btn-secondary" data-day="${d.id}">registro rápido</button>
    </div>`;

    html += `<div class="ghost-row">
      <button type="button" class="reorder-toggle btn btn-ghost" data-day="${d.id}">reordenar</button>
      <button type="button" class="reorder-reset btn btn-ghost" data-day="${d.id}" style="display:${hasCustomOrder(d.id) ? 'inline-block' : 'none'};">restaurar ordem padrão</button>
    </div>`;

    html += `<p class="cooldown-note">${d.cooldown}</p>`;
    html += `</div></div>`;

    panel.innerHTML = html;
    container.appendChild(panel);
  });

  document.querySelectorAll('.ex-row').forEach(row => {
    row.querySelector('.ex-head').addEventListener('click', () => {
      const isOpen = row.classList.contains('open');
      row.classList.toggle('open', !isOpen);
      row.querySelector('.ex-plus').textContent = isOpen ? '+' : '−';
    });
  });

  document.querySelectorAll('.reorder-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.day-panel').classList.toggle('reorder-active');
    });
  });

  document.querySelectorAll('.reorder-reset').forEach(btn => {
    btn.addEventListener('click', () => {
      clearOrder(btn.dataset.day);
      buildPanels(btn.dataset.day);
      document.querySelector(`.day-panel[data-id="${btn.dataset.day}"]`)?.classList.add('reorder-active');
    });
  });

  document.querySelectorAll('.arrow-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = btn.closest('.ex-row');
      const dayId = btn.closest('.day-panel').dataset.id;
      const day = days.find(d => d.id === dayId);
      const order = getOrder(dayId, day.exercises.length);
      const realIdx = parseInt(row.dataset.idx, 10);
      const pos = order.indexOf(realIdx);
      const swapWith = btn.dataset.dir === 'up' ? pos - 1 : pos + 1;
      if (swapWith < 0 || swapWith >= order.length) return;
      [order[pos], order[swapWith]] = [order[swapWith], order[pos]];
      saveOrder(dayId, order);
      buildPanels(dayId);
      document.querySelector(`.day-panel[data-id="${dayId}"]`)?.classList.add('reorder-active');
    });
  });

  document.querySelectorAll('.done-checkbox').forEach(box => {
    box.addEventListener('change', () => {
      const dayId = box.dataset.day;
      const exIdx = parseInt(box.dataset.idx, 10);
      const nowDone = toggleCompletion(dayId, exIdx);
      const nameEl = box.closest('.ex-row').querySelector('.ex-name');
      let dot = nameEl.querySelector('.done-dot');
      if (nowDone && !dot) {
        dot = document.createElement('span');
        dot.className = 'done-dot';
        dot.setAttribute('aria-label', 'Feito esta semana');
        nameEl.appendChild(dot);
      } else if (!nowDone && dot) {
        dot.remove();
      }
    });
  });

  document.querySelectorAll('.weight-track').forEach(el => renderWeightTrack(el));
  const _act = document.querySelector('.day-panel.active'); if (_act) setHeroPainting(_act.dataset.id);

  document.querySelectorAll('.quick-register').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.closest('.day-panel');
      const rows = panel.querySelectorAll('.ex-row');
      const willOpen = !panel.classList.contains('all-open');
      rows.forEach(row => {
        row.classList.toggle('open', willOpen);
        row.querySelector('.ex-plus').textContent = willOpen ? '−' : '+';
      });
      panel.classList.toggle('all-open', willOpen);
      btn.classList.toggle('active', willOpen);
      btn.textContent = willOpen ? 'fechar registro' : 'registro rápido';
    });
  });
}

function renderWeightTrack(el) {
  const dayId = el.dataset.day;
  const exIdx = parseInt(el.dataset.idx, 10);
  const last = getLastEntry(dayId, exIdx);
  const lastLabel = formatWeight(last);
  const defaultTipo = last ? last.tipo : 'total';

  el.innerHTML = `
    ${lastLabel ? `<div class="weight-last">última vez: <b>${lastLabel}</b> (${last.data.split('-').reverse().join('/')})</div>` : `<div class="weight-last">ainda sem registro</div>`}
    <div class="weight-form">
      <input type="number" step="0.5" min="0" class="weight-input" placeholder="peso" value="${last ? last.valor : ''}">
      <select class="weight-type">
        <option value="total" ${defaultTipo === 'total' ? 'selected' : ''}>total</option>
        <option value="lado" ${defaultTipo === 'lado' ? 'selected' : ''}>por lado</option>
      </select>
      <button type="button" class="weight-save btn btn-primary">salvar</button>
      <span class="weight-saved-tag" style="display:none;">salvo ✓</span>
    </div>`;

  const input = el.querySelector('.weight-input');
  const select = el.querySelector('.weight-type');
  const btn = el.querySelector('.weight-save');
  const tag = el.querySelector('.weight-saved-tag');
  const lastLine = el.querySelector('.weight-last');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const valor = parseFloat(input.value);
    if (!valor && valor !== 0) return;
    const tipo = select.value;
    addHistoryEntry(dayId, exIdx, valor, tipo);
    const novo = getLastEntry(dayId, exIdx);
    lastLine.innerHTML = `última vez: <b>${formatWeight(novo)}</b> (${novo.data.split('-').reverse().join('/')})`;
    tag.style.display = 'inline';
    setTimeout(() => { tag.style.display = 'none'; }, 1800);
    buildProgressao();
  });

  [input, select].forEach(field => field.addEventListener('click', e => e.stopPropagation()));
}

function buildProgressao() {
  const container = document.getElementById('progressaoContent');
  if (!container) return;

  const options = [];
  days.forEach(d => {
    if (d.rest) return;
    d.exercises.forEach((ex, idx) => {
      const hist = getHistory(d.id, idx);
      if (hist.length > 0) {
        options.push({ dayId: d.id, dayLabel: d.title, idx, name: ex.name, hist });
      }
    });
  });

  if (options.length === 0) {
    container.innerHTML = `<p class="progress-empty">Nenhum registro de peso ainda. Registre um peso em qualquer exercício pra começar a ver a progressão aqui.</p>`;
    return;
  }

  const selectId = 'progressaoSelect';
  let html = `<select id="${selectId}" class="progress-select">`;
  options.forEach((o, i) => {
    html += `<option value="${i}">${o.dayLabel} — ${o.name}</option>`;
  });
  html += `</select><div id="progressaoChart"></div>`;
  container.innerHTML = html;

  const select = document.getElementById(selectId);
  const draw = () => renderProgressChart(options[parseInt(select.value, 10)]);
  select.addEventListener('change', draw);
  draw();
}

function renderProgressChart(opt) {
  const chartEl = document.getElementById('progressaoChart');
  const hist = opt.hist;

  if (hist.length === 1) {
    chartEl.innerHTML = `<p class="progress-empty">Só tem 1 registro (${formatWeight(hist[0])}, ${hist[0].data.split('-').reverse().join('/')}) — precisa de pelo menos 2 pra desenhar progressão.</p>`;
    return;
  }

  const W = 600, H = 220, padL = 40, padR = 16, padT = 16, padB = 30;
  const valores = hist.map(h => h.valor);
  const min = Math.min(...valores), max = Math.max(...valores);
  const range = (max - min) || 1;
  const yFor = v => padT + (H - padT - padB) * (1 - (v - min) / range);
  const xFor = i => padL + (W - padL - padR) * (hist.length === 1 ? 0.5 : i / (hist.length - 1));

  const points = hist.map((h, i) => `${xFor(i)},${yFor(h.valor)}`).join(' ');
  const dots = hist.map((h, i) => `<circle cx="${xFor(i)}" cy="${yFor(h.valor)}" r="3.5" fill="var(--accent)" />`).join('');
  const labels = hist.map((h, i) => {
    if (hist.length > 8 && i % Math.ceil(hist.length / 8) !== 0 && i !== hist.length - 1) return '';
    const d = h.data.split('-');
    return `<text x="${xFor(i)}" y="${H - 8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${d[2]}/${d[1]}</text>`;
  }).join('');

  chartEl.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="progress-svg">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--hair)" stroke-width="1" />
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--hair)" stroke-width="1" />
      <text x="${padL - 6}" y="${yFor(max) + 4}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${max}</text>
      <text x="${padL - 6}" y="${yFor(min) + 4}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${min}</text>
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
      ${labels}
    </svg>
    <div class="progress-current">atual: <b>${formatWeight(hist[hist.length - 1])}</b> · ${hist.length} registros</div>`;
}

function buildAccordion(dayId) {
  const container = document.getElementById('accordion');
  container.innerHTML = '';
  const day = days.find(d => d.id === dayId) || days[0];
  const items = day.rest ? commonAccordion : [...(day.appendix || []), ...commonAccordion];
  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'appendix-item';
    el.innerHTML = `
      <div class="ai-head">
        <div class="ai-num">${String(i + 1).padStart(2, '0')}</div>
        <h3>${item.title}</h3>
        <div class="ai-hint">ler mais</div>
      </div>
      <div class="ai-body"><div class="ai-body-inner">${item.body}</div></div>`;
    el.addEventListener('click', () => {
      const isOpen = el.classList.contains('open');
      el.classList.toggle('open', !isOpen);
      el.querySelector('.ai-hint').textContent = isOpen ? 'fechar' : 'ler mais';
    });
    container.appendChild(el);
  });
}

function initPWA() {
  const manifest = {
    name: 'Protocolo Maki',
    short_name: 'Maki',
    description: 'Construída, não dada — rotina de treino da Helena.',
    start_url: '.',
    display: 'standalone',
    background_color: '#2A1B22',
    theme_color: '#2A1B22',
    orientation: 'portrait-primary',
    icons: [
      {
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%232B241D'/%3E%3Ctext x='96' y='130' font-family='Georgia, serif' font-style='italic' font-size='102' fill='%23F3ECE2' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E",
        sizes: '192x192',
        type: 'image/svg+xml'
      },
      {
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%232B241D'/%3E%3Ctext x='256' y='348' font-family='Georgia, serif' font-style='italic' font-size='272' fill='%23F3ECE2' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E",
        sizes: '512x512',
        type: 'image/svg+xml'
      }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('manifestLink').setAttribute('href', URL.createObjectURL(blob));

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.open('maki-v3').then(cache =>
            fetch(e.request).then(res => {
              cache.put(e.request, res.clone());
              return res;
            }).catch(() => cache.match(e.request))
          )
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }
}

function initTheme() {
  const saved = localStorage.getItem('maki-theme');
  const theme = saved || 'light';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  function applyMeta(t) {
    metaTheme.setAttribute('content', t === 'dark' ? '#2A1B22' : '#F1DFC3');
  }
  document.documentElement.setAttribute('data-theme', theme); document.body.setAttribute('data-theme', theme);
  applyMeta(theme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); document.body.setAttribute('data-theme', next);
    applyMeta(next);
    localStorage.setItem('maki-theme', next);
  });
}

const WEEKDAY_TO_ID = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
const todayId = WEEKDAY_TO_ID[new Date().getDay()];

initTheme();
initPWA();
buildWeekStrip();
buildPanels();

const startId = days.find(d => d.id === todayId) ? todayId : days[0].id;
buildAccordion(startId);
buildProgressao();
selectDay(startId);



</script>
